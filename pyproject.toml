[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "jinja2",
    "pyyaml",
    "ruamel.yaml",
    "tqdm",
    "prompt-toolkit",
    "rich",
    "readability-lxml",
    "mcp",
    "python-dotenv",
]

[project.optional-dependencies]
feishu = ["lark-oapi"]
database = ["sqlalchemy", "psycopg2-binary"]

[project.scripts]
philo-oneshot = "philo.cfgops.o0:main"
philo-interactive = "philo.cfgops.i0:main"
philo-server = "philo.cfgops.s0:main"

[tool.hatch.build.targets.wheel]
packages = ["philo"]

